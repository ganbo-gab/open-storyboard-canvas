name: Build Open Storyboard Canvas

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.1.0). Leave empty to skip release job.'
        required: false
        type: string
      release_notes:
        description: 'Release notes shown on GitHub Release. Optional when using tag push.'
        required: false
        type: string
      macos_adhoc:
        description: 'Explicitly allow an ad-hoc Mac build or release: not notarized; updates can prompt for each saved credential.'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Force LF checkout policy
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Update version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } elseif ("$env:RELEASE_TAG_INPUT" -like 'v*') {
            $VERSION = "$env:RELEASE_TAG_INPUT" -replace '^v', ''
          } else {
            throw "Invalid release_tag. Use format like v0.1.0"
          }
          node scripts/sync-version.mjs $VERSION

      - name: Record expected version metadata
        shell: bash
        run: git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Install dependencies
        run: npm ci

      - name: Verify line endings
        run: npm run check:line-endings

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check Rust workspace
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build application
        run: npx tauri build --ci --bundles nsis

      - name: Verify lockfiles and generated sources stayed clean
        shell: bash
        run: git diff --exit-code

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $RELEASE_APP_NAME = "open-storyboard-canvas"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } elseif ("$env:RELEASE_TAG_INPUT" -like 'v*') {
            $VERSION = "$env:RELEASE_TAG_INPUT" -replace '^v', ''
          } else {
            $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          }
          # Rename NSIS installer
          $NSIS_PATH = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($NSIS_PATH) {
            $NEW_NAME = "${RELEASE_APP_NAME}_${VERSION}_x64-setup.exe"
            $NEW_PATH = Join-Path (Split-Path $NSIS_PATH.FullName) $NEW_NAME
            Move-Item -Path $NSIS_PATH.FullName -Destination $NEW_PATH -Force
            Write-Host "Renamed to: $NEW_NAME"
          } else {
            throw "No NSIS installer found under src-tauri/target/release/bundle/nsis"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: open-storyboard-canvas-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Force LF checkout policy
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Test macOS signing policy
        run: node --test scripts/mac-signing.node-tests.mjs

      - name: Require a deliberate macOS signing identity
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_ALLOW_ADHOC: ${{ github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
          MACOS_ALLOW_ADHOC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
        run: node scripts/mac-signing.mjs check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Update version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "$RELEASE_TAG_INPUT" == v* ]]; then
            VERSION="$RELEASE_TAG_INPUT"
            VERSION=${VERSION#v}
          else
            echo "Invalid release_tag. Use format like v0.1.0"
            exit 1
          fi
          node scripts/sync-version.mjs "$VERSION"

      - name: Record expected version metadata
        run: git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Install dependencies
        run: npm ci

      - name: Verify line endings
        run: npm run check:line-endings

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check Rust workspace
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build application (Universal Binary)
        env:
          CC: ""
          CXX: ""
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_ALLOW_ADHOC: ${{ github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
          MACOS_ALLOW_ADHOC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
        run: node scripts/mac-signing.mjs build --target universal-apple-darwin --bundles app,dmg --ci

      - name: Verify macOS signature identity for every architecture
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_ALLOW_ADHOC: ${{ github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
          MACOS_ALLOW_ADHOC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.macos_adhoc == 'true' && '1' || '0' }}
        run: node scripts/mac-signing.mjs verify "src-tauri/target/universal-apple-darwin/release/bundle/macos/Open Storyboard Canvas.app"

      - name: Verify lockfiles and generated sources stayed clean
        run: git diff --exit-code

      - name: Rename macOS DMG
        run: |
          RELEASE_APP_NAME="open-storyboard-canvas"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "$RELEASE_TAG_INPUT" == v* ]]; then
            VERSION="$RELEASE_TAG_INPUT"
            VERSION=${VERSION#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found under src-tauri/target/universal-apple-darwin/release/bundle/dmg"
            exit 1
          fi
          NEW_NAME="${RELEASE_APP_NAME}_${VERSION}_universal.dmg"
          NEW_PATH="$(dirname "$DMG_PATH")/$NEW_NAME"
          mv "$DMG_PATH" "$NEW_PATH"
          echo "Renamed to: $NEW_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: open-storyboard-canvas-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: resolve_release
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi
          if [[ -n "$INPUT_NOTES" ]]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
          elif [[ -f "docs/releases/$TAG.md" ]]; then
            cp "docs/releases/$TAG.md" release-notes.md
          else
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > release-notes.md
          fi
          test -s release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: open-storyboard-canvas-windows-installer
          path: artifacts/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: open-storyboard-canvas-macos-dmg
          path: artifacts/macos

      - name: Publish verified installers with Chinese release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve_release.outputs.tag }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/windows/*.exe artifacts/macos/*.dmg release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum *.exe *.dmg > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG; inspect it before rerunning publication."
            exit 1
          fi
          # The run's GITHUB_TOKEN creates a missing tag only after both builds
          # pass. Its push event does not start a second workflow run.
          TAG_REF=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [[ -z "$TAG_REF" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          # Fetch the exact remote tag and peel annotated tags. Never publish
          # artifacts from this run under a tag pointing at another commit.
          git fetch --no-tags origin "refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Release tag does not point at this build's commit."
            exit 1
          fi
          FIRST_LINE=$(head -n 1 release-notes.md)
          TITLE="Open Storyboard Canvas $TAG"
          if [[ "$FIRST_LINE" == "# ${TAG}："* ]]; then
            TITLE="$TITLE · ${FIRST_LINE#"# ${TAG}："}"
          fi
          gh release create "$TAG" release-assets/* --verify-tag --draft \
            --title "$TITLE" \
            --notes-file release-notes.md
          # Address this one draft directly; a tag lookup can pick an older public
          # release when a previous run left another draft under the same tag.
          RELEASE_ID=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --silent
