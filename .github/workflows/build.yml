name: Build Open Storyboard Canvas

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.1.0). Leave empty to skip release job.'
        required: false
        type: string
      release_notes:
        description: 'Release notes shown on GitHub Release. Optional when using tag push.'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Force LF checkout policy
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Update version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } elseif ("$env:RELEASE_TAG_INPUT" -like 'v*') {
            $VERSION = "$env:RELEASE_TAG_INPUT" -replace '^v', ''
          } else {
            throw "Invalid release_tag. Use format like v0.1.0"
          }
          node scripts/sync-version.mjs $VERSION

      - name: Record expected version metadata
        shell: bash
        run: git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Install dependencies
        run: npm ci

      - name: Verify line endings
        run: npm run check:line-endings

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check Rust workspace
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build application
        run: npx tauri build --ci --bundles nsis

      - name: Verify lockfiles and generated sources stayed clean
        shell: bash
        run: git diff --exit-code

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $RELEASE_APP_NAME = "open-storyboard-canvas"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } elseif ("$env:RELEASE_TAG_INPUT" -like 'v*') {
            $VERSION = "$env:RELEASE_TAG_INPUT" -replace '^v', ''
          } else {
            $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          }
          # Rename NSIS installer
          $NSIS_PATH = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($NSIS_PATH) {
            $NEW_NAME = "${RELEASE_APP_NAME}_${VERSION}_x64-setup.exe"
            $NEW_PATH = Join-Path (Split-Path $NSIS_PATH.FullName) $NEW_NAME
            Move-Item -Path $NSIS_PATH.FullName -Destination $NEW_PATH -Force
            Write-Host "Renamed to: $NEW_NAME"
          } else {
            throw "No NSIS installer found under src-tauri/target/release/bundle/nsis"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: open-storyboard-canvas-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Force LF checkout policy
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Update version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "$RELEASE_TAG_INPUT" == v* ]]; then
            VERSION="$RELEASE_TAG_INPUT"
            VERSION=${VERSION#v}
          else
            echo "Invalid release_tag. Use format like v0.1.0"
            exit 1
          fi
          node scripts/sync-version.mjs "$VERSION"

      - name: Record expected version metadata
        run: git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Install dependencies
        run: npm ci

      - name: Verify line endings
        run: npm run check:line-endings

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check Rust workspace
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build application (Universal Binary)
        env:
          CC: ""
          CXX: ""
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --target universal-apple-darwin --bundles dmg --ci

      - name: Verify lockfiles and generated sources stayed clean
        run: git diff --exit-code

      - name: Rename macOS DMG
        run: |
          RELEASE_APP_NAME="open-storyboard-canvas"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "$RELEASE_TAG_INPUT" == v* ]]; then
            VERSION="$RELEASE_TAG_INPUT"
            VERSION=${VERSION#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found under src-tauri/target/universal-apple-darwin/release/bundle/dmg"
            exit 1
          fi
          NEW_NAME="${RELEASE_APP_NAME}_${VERSION}_universal.dmg"
          NEW_PATH="$(dirname "$DMG_PATH")/$NEW_NAME"
          mv "$DMG_PATH" "$NEW_PATH"
          echo "Renamed to: $NEW_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: open-storyboard-canvas-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: resolve_release
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi
          if [[ -n "$INPUT_NOTES" ]]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
          elif [[ -f "docs/releases/$TAG.md" ]]; then
            cp "docs/releases/$TAG.md" release-notes.md
          else
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > release-notes.md
          fi
          test -s release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: open-storyboard-canvas-windows-installer
          path: artifacts/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: open-storyboard-canvas-macos-dmg
          path: artifacts/macos

      - name: Publish verified installers with Chinese release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve_release.outputs.tag }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/windows/*.exe artifacts/macos/*.dmg release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum *.exe *.dmg > SHA256SUMS.txt)
          gh release create "$TAG" release-assets/* --verify-tag --draft \
            --title "Open Storyboard Canvas $TAG · 全面重构与创作工作流升级" \
            --notes-file release-notes.md
          gh release edit "$TAG" --draft=false --latest
