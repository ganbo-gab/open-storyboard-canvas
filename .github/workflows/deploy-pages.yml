name: Deploy GitHub Pages Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/brand/**"
      - "docs/imgs/readme/current/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static site with shared brand & demo assets
        run: |
          mkdir -p _site/assets/brand _site/assets/media
          cp -r website/* _site/
          cp docs/brand/open-storyboard-canvas-icon.png docs/brand/social-preview.png _site/assets/brand/
          cp docs/imgs/readme/current/* _site/assets/media/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
